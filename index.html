<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diksha &amp; Abhas · Wedding Invitation</title>
    <meta name="description" content="You're invited to the wedding of Diksha &amp; Abhas · 3 December 2026 · Lucknow" />
    <meta name="theme-color" content="#7a1f3d" />

    <!-- Link preview on WhatsApp, Instagram, Facebook etc. The image must be a full https URL,
         so %VITE_SITE_URL% is filled in from the .env file when Vite builds the site. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Diksha &amp; Abhas · Wedding Invitation" />
    <meta property="og:description" content="3 December 2026 · Lucknow. Tap to open your invitation." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%images/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wedding invitation for Diksha &amp; Abhas, 3 December 2026, Lucknow" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <!-- React draws the whole invitation inside this one div (see src/main.jsx) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
